
name: Deploy devops-app

on:
  push:
    branches:
      - main

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Get short commit tag
        run: echo "short_tag=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

        # - name: Build Docker image
        #   run: docker build -t "${{ vars.DOCKER_USERNAME }}/devops-app:latest" .

        # - name: Tag Docker image
        #   run: docker tag "${{ vars.DOCKER_USERNAME }}/devops-app:latest" "${{ vars.DOCKER_USERNAME }}/devops-app:${{ env.short_tag }}"

        # - name: Push Docker image with latest tag
        #   run: docker push "${{ vars.DOCKER_USERNAME }}/devops-app:latest"

        # - name: Push Docker image with commit tag
        #   run: docker push "${{ vars.DOCKER_USERNAME }}/devops-app:${{ env.short_tag }}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: 
            ${{ vars.DOCKER_USERNAME }}/devops-app:${{ env.short_tag }}
            ${{ vars.DOCKER_USERNAME }}/devops-app:latest
